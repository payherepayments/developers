    ValidationError:
      type: object
      description: Validation errors returned when submitted attributes are invalid.
      required:
      - error
      - validation_errors
      - full_errors
      - form_errors
      properties:
        error:
          type: string
          description: Human-readable explanation of the error.
          example: The request could not be completed.
          readOnly: true
        validation_errors:
          type: array
          description: Validation messages grouped by field.
          readOnly: true
          items:
            type: object
            required:
            - field
            - errors
            properties:
              field:
                type: string
                description: Attribute that failed validation.
                example: name
                readOnly: true
              errors:
                type: array
                description: Validation messages for the attribute.
                items:
                  type: string
                example:
                - can't be blank
                readOnly: true
            additionalProperties: false
        full_errors:
          type: array
          description: Complete validation messages including field names.
          items:
            type: string
          example:
          - Name can't be blank
          readOnly: true
        form_errors:
          type: object
          description: Field names mapped to messages for displaying beside form inputs.
          example:
            name: can't be blank
          readOnly: true
          additionalProperties:
            type: string
      additionalProperties: false
      examples:
      - error: Plan validation failed
        validation_errors:
        - field: name
          errors:
          - can't be blank
        full_errors:
        - Name can't be blank
        form_errors:
          name: can't be blank
      title: ValidationError
